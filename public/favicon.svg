<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Super Sale">
  <title>Super Sale</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#bg)" />
  <!-- Hairline ring so the tile keeps its edge on dark backgrounds. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.4" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />

  <!-- A browser tab renders this at 16px, so the monogram fills almost the
       whole tile: heavy weight, tight tracking, and no accent rule, which at
       that size only crowded the letters. The blue sits on the second S
       instead, where it survives downscaling as a hint of brand colour. -->
  <text
    x="32"
    y="47"
    text-anchor="middle"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-4"
    fill="#ffffff"
  >S<tspan fill="#60a5fa">S</tspan></text>
</svg>
